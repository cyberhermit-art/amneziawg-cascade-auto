name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Resolve dependencies
        run: go mod tidy && git diff --stat go.mod go.sum || true

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=${{ steps.ver.outputs.version }}" -o dist/AmneziaWG-Cascade.exe .
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/
          cd dist && zip -q AmneziaWG-Cascade-${{ steps.ver.outputs.version }}-windows-x64.zip AmneziaWG-Cascade.exe LICENSE NOTICE THIRD_PARTY_NOTICES.md
          sha256sum AmneziaWG-Cascade.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AmneziaWG-Cascade-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
